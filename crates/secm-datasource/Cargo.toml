[package]
name = "secm-datasource"
version.workspace = true
description = "SECM 纯 Rust 驱动采集模块 — Win32/注册表/电源/网络/DNS/CPU 频率/磁盘/SMART 底层数据采集（替代 PowerShell/外部命令数据源）"
edition.workspace = true
license.workspace = true

[lib]
name = "secm_datasource"
crate-type = ["lib"]

[dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
    # 0.61 起 GetIfTable2/IP_ADAPTER_ADDRESSES_LH/MIB_IF_TABLE2 门控于本 feature
    "Win32_NetworkManagement_Ndis",
    # DNS 缓存刷新（dnsapi，cleanup 经 secm_datasource::dns 调用）
    "Win32_NetworkManagement_Dns",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
    # P15 磁盘 IO 速度：PDH 性能计数器（pdh.dll）
    "Win32_System_Performance",
    # P14 磁盘枚举 / SMART 读取：存储设备 IOCTL
    "Win32_Storage_FileSystem",
    "Win32_Storage_IscsiDisc",
    "Win32_Storage_Nvme",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
winreg.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
log.workspace = true
# P1 激活状态 / P2 补丁兜底：WMI 查询
wmi = "0.18"

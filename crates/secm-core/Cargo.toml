[package]
name = "secm-core"
version.workspace = true
description = "SECM GPUI 重构 — 业务逻辑层（采集编排/系统操作，无 UI 依赖）"
edition.workspace = true
license.workspace = true

[lib]
name = "secm_core"
crate-type = ["lib"]

[dependencies]
secm-datasource.workspace = true
encoding_rs = "0.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
ureq.workspace = true
sysinfo = "0.30"
# 仅保留实际使用的 Win32 面（历史列表整段拷贝自 datasource，含大量死 feature）
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
parking_lot = "0.12"
chrono = "0.4"
winreg.workspace = true

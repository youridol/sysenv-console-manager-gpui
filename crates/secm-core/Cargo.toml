[package]
name = "secm-core"
version.workspace = true
description = "SECM GPUI 重构 — 业务逻辑层（采集编排/系统操作，无 UI 依赖）"
edition.workspace = true
license.workspace = true

[lib]
name = "secm_core"
crate-type = ["lib"]

[dependencies]
secm-datasource.workspace = true
encoding_rs = "0.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
ureq.workspace = true
sysinfo = "0.30"
# 网络诊断（net_diag）：SO_REUSEADDR/广播/TTL socket 选项 + 随机事务 ID（均为依赖树既有版本）
socket2 = "0.6"
rand = "0.8"
# 仅保留实际使用的 Win32 面（历史列表整段拷贝自 datasource，含大量死 feature）
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    # net_diag ICMP 引擎：IcmpSendEcho2/Icmp6SendEcho2（iphlpapi 系统态 ICMP，非管理员可用）
    "Win32_NetworkManagement_IpHelper",
    # net_diag SOCKADDR_IN/IN6、WSAGetLastError、htons
    "Win32_Networking_WinSock",
    # net_diag IcmpSendEcho2/Icmp6SendEcho2 签名中的 PIO_APC_ROUTINE 类型门控
    "Win32_System_IO",
] }
parking_lot = "0.12"
chrono = "0.4"
winreg.workspace = true

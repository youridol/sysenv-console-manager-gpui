[workspace]
resolver = "2"
members = [
    "crates/secm-datasource",
    "crates/secm-core",
    "crates/secm-app",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["SECM Team"]
repository = "https://github.com/youridol/sysenv-console-manager"

[workspace.dependencies]
gpui = "0.2"
secm-datasource = { path = "crates/secm-datasource" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
ureq = "2"
winreg = "0.52"
windows-sys = "0.59"

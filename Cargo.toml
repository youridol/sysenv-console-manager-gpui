[workspace]
resolver = "2"
members = [
    "crates/secm-datasource",
    "crates/secm-core",
    "crates/secm-app",
]

[workspace.package]
version = "2.8.1"
edition = "2021"
license = "MIT"
authors = ["SysEnv Console Manager"]
repository = "https://github.com/youridol/sysenv-console-manager"

[workspace.dependencies]
gpui = "0.2"
secm-datasource = { path = "crates/secm-datasource" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = { version = "0.4", features = ["std"] }
ureq = "2"
winreg = "0.56"
windows-sys = "0.61"

[profile.dev]
opt-level = 0
incremental = true
